<body>

<header>

<main>

</main>

<script>

    const API_URL = "http://127.0.0.1:8000";

    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const resultsContainer = document.getElementById("results");
    const status = document.getElementById("status");
    const videoPlayer = document.getElementById("videoPlayer");
    const videoInput = document.getElementById("videoInput");
    const videoName = document.getElementById("videoName");


    /*
     * CHOISIR UNE VIDÉO
     */

  ```javascript
videoInput.addEventListener("change", async function () {

    const file = videoInput.files[0];

    if (!file) {
        return;
    }

    status.textContent = "Envoi de la vidéo...";
    resultsContainer.innerHTML = "";

    const formData = new FormData();
    formData.append("file", file);

    try {

        const response = await fetch(
            `${API_URL}/upload`,
            {
                method: "POST",
                body: formData
            }
        );

        if (!response.ok) {
            throw new Error(
                `Erreur upload : ${response.status}`
            );
        }

        const data = await response.json();

        console.log("Vidéo envoyée :", data);

        // Afficher immédiatement la vidéo sélectionnée
        const videoURL = URL.createObjectURL(file);

        videoPlayer.src = videoURL;
        videoPlayer.load();

        // Afficher le nom du fichier
        videoName.textContent =
            `Vidéo actuelle : ${file.name}`;

        status.textContent =
            "Vidéo chargée avec succès.";

    } catch (error) {

        console.error(
            "Erreur upload :",
            error
        );

        status.textContent =
            "Impossible d'envoyer la vidéo au serveur.";

    }

});
```



    /*
     * RECHERCHE
     */

    searchButton.addEventListener("click", searchVideo);


    async function searchVideo() {

        const query = searchInput.value.trim();

        if (!query) {

            status.textContent =
                "Écris un mot à rechercher.";

            resultsContainer.innerHTML = "";

            return;
        }

        status.textContent =
            "Recherche en cours...";

        resultsContainer.innerHTML = "";

        try {

            const response = await fetch(
                `${API_URL}/search?q=${encodeURIComponent(query)}`
            );

            if (!response.ok) {

                throw new Error(
                    `Erreur API : ${response.status}`
                );

            }

            const data = await response.json();

            console.log(
                "Résultats reçus :",
                data
            );

            status.textContent =
                `${data.count} résultat(s) trouvé(s)`;


            if (!data.results ||
                data.results.length === 0) {

                resultsContainer.innerHTML =
                    "<p>Aucun résultat.</p>";

                return;
            }


            data.results.forEach(result => {

                const resultElement =
                    document.createElement("div");

                resultElement.className =
                    "result";


                resultElement.innerHTML = `

                    <div class="time">
                        ${formatTime(result.start)}
                    </div>

                    <div class="text">
                        ${escapeHtml(result.text)}
                    </div>

                `;


                /*
                 * CLIQUER SUR UN TIMESTAMP
                 */

                resultElement.addEventListener(
                    "click",
                    () => {

                        const startTime =
                            Number(result.start);

                        console.log(
                            "Timestamp demandé :",
                            startTime
                        );


                        if (
                            Number.isNaN(startTime)
                        ) {

                            console.error(
                                "Timestamp invalide"
                            );

                            return;
                        }


                        videoPlayer.currentTime =
                            startTime;


                        console.log(
                            "Position après currentTime :",
                            videoPlayer.currentTime
                        );


                        videoPlayer.play()
                            .then(() => {

                                console.log(
                                    "Lecture lancée à :",
                                    videoPlayer.currentTime
                                );

                            })
                            .catch(error => {

                                console.error(
                                    "Erreur play :",
                                    error
                                );

                            });

                    }
                );


                resultsContainer.appendChild(
                    resultElement
                );

            });


        } catch (error) {

            console.error(
                "Erreur :",
                error
            );

            status.textContent =
                "Impossible de contacter le serveur.";

            resultsContainer.innerHTML = `

                <p class="error">
                    Vérifie que FastAPI est bien lancé sur
                    http://127.0.0.1:8000
                </p>

            `;

        }

    }


    /*
     * FORMAT TIMESTAMP
     */

    function formatTime(seconds) {

        const minutes =
            Math.floor(seconds / 60);

        const remainingSeconds =
            Math.floor(seconds % 60);

        return `${String(minutes).padStart(2, "0")}:${String(remainingSeconds).padStart(2, "0")}`;

    }


    /*
     * PROTECTION DU TEXTE HTML
     */

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    /*
     * ENTRÉE = RECHERCHE
     */

    searchInput.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                searchVideo();

            }

        }
    );

</script>
